version: 2
updates:
  - package-ecosystem: pip
    directory: /skills/crown-plan-agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      crown-runtime:
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      audit-toolchain:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
