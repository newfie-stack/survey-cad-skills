name: Crown Plan Agent Offline Tests
on:
  push:
    paths:
      - 'skills/crown-plan-agent/**'
      - '.github/workflows/crown-plan-agent-tests.yml'
      - '.github/requirements-audit.*'
      - '.github/bootstrap-pip.txt'
      - '.github/scripts/audit_requirements.py'
      - '.github/tests/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'skills/crown-plan-agent/**'
      - '.github/workflows/crown-plan-agent-tests.yml'
      - '.github/requirements-audit.*'
      - '.github/bootstrap-pip.txt'
      - '.github/scripts/audit_requirements.py'
      - '.github/tests/**'
      - '.github/dependabot.yml'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true
      - name: Bootstrap the pinned installer
        run: python -m pip install --require-hashes -r .github/bootstrap-pip.txt
      - name: Install PDF inspection dependency
        run: python -m pip install --require-hashes -r skills/crown-plan-agent/requirements.txt
      - name: Record interpreter-native library versions
        run: |
          python -c "import json,ssl,pyexpat; print(json.dumps({'openssl': ssl.OPENSSL_VERSION, 'expat': pyexpat.EXPAT_VERSION}))"
      - name: Verify supported PDF runtime
        run: python skills/crown-plan-agent/engine/runtime_security.py
      - name: Compile Crown Plan Agent Python modules
        run: python -m compileall -q skills/crown-plan-agent/engine skills/crown-plan-agent/tests
      - name: Smoke-test standalone review
        run: python skills/crown-plan-agent/tests/smoke_review.py
      - name: Run synthetic offline tests
        run: python -m unittest discover -s skills/crown-plan-agent/tests -p 'test_*.py' -v
      - name: Run finished-plan error-detection benchmark
        run: python skills/crown-plan-agent/tests/finished_plan_benchmark.py --output "$RUNNER_TEMP/finished-plan-benchmark"
      - name: Build the ChatGPT plugin from the canonical skill
        run: python skills/crown-plan-agent/tools/build_chatgpt_plugin.py --output "$RUNNER_TEMP/crown-plan-agent-chatgpt.zip"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true
      - name: Install pinned audit tools
        id: install_audit_tools
        run: python -m pip install --require-hashes -r .github/requirements-audit.txt -r .github/bootstrap-pip.txt
      - name: Test audit coverage verification
        run: python -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Audit application dependencies
        run: python .github/scripts/audit_requirements.py --output "$RUNNER_TEMP/runtime-dependency-audit.json" -r skills/crown-plan-agent/requirements.txt
      - name: Audit audit-tool dependencies
        if: ${{ !cancelled() && steps.install_audit_tools.outcome == 'success' }}
        run: python .github/scripts/audit_requirements.py --output "$RUNNER_TEMP/tool-dependency-audit.json" -r .github/requirements-audit.txt -r .github/bootstrap-pip.txt
